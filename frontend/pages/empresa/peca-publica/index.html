<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A História desta Peça — CONTINUUM</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="publica.css" />
  </head>
  <body>
    <main data-skeleton class="mobile-container">
      <div class="topbar">
        <div class="topbar-logo">CONTINUUM</div>
      </div>

      <!-- Cabeçalho (Peca e Designer) -->
      <header class="hero">
        <h1 class="hero-title">—</h1>
        <p class="hero-designer">por —</p>
      </header>

      <div class="content-area">
        <!-- Origem -->
        <div class="info-card info-grid">
          <div>
            <div class="info-label">Material de Origem</div>
            <div class="info-val">—</div>
          </div>
          <div>
            <div class="info-label">Loja</div>
            <div class="info-val">—</div>
          </div>
        </div>

        <!-- História (Processo Criativo) -->
        <h2 class="section-title">O Processo</h2>
        <blockquote class="story-block"></blockquote>

        <!-- Linha do tempo -->
        <h2 class="section-title">A Jornada da Peça</h2>
        <div class="timeline"></div>

        <div class="cta-container">
          <a href="../../../index.html" class="btn">Faça parte do CONTINUUM</a>
          <p class="public-footer-note">A Moda não precisa ter um fim.</p>
        </div>
      </div>
    </main>
    <script type="module">
      import { api } from "../../../js/shared/api.js";
      document.addEventListener("DOMContentLoaded", async () => {
        const params = new URLSearchParams(location.search);
        const codigo = params.get("codigo") || params.get("id");
        if (!codigo) return;
        try {
          const p = await api.obterPecaPublica(codigo);
          if (!p) return;
          const title = document.querySelector(".hero-title");
          if (title) title.textContent = p.tituloPeca || p.lote_nome || "—";
          const designer = document.querySelector(".hero-designer");
          if (designer) designer.innerHTML = `por ${p.designer_nome || "—"} <span class="hero-badge">AUTORAL</span>`;
          const infoVals = document.querySelectorAll(".info-grid .info-val");
          if (infoVals[0]) infoVals[0].textContent = p.material || p.lote?.descricao || "—";
          if (infoVals[1]) infoVals[1].textContent = p.nomeEmpresa || p.lote?.nomeEmpresa || "—";
          const story = document.querySelector(".story-block");
          if (story && (p.processoCriativo || p.ds_descricao)) {
            story.textContent = p.processoCriativo || p.ds_descricao;
          }
          const tlContainer = document.querySelector(".timeline");
          if (tlContainer && Array.isArray(p.timeline) && p.timeline.length > 0) {
            tlContainer.innerHTML = p.timeline
              .map(
                (item) => `
              <div class="tl-item">
                <div class="tl-title">${item.status || "Etapa"}</div>
                <div class="tl-desc">${item.titulo || item.evento} (${new Date(item.data).toLocaleDateString("pt-BR")} • ${item.autor || ""})</div>
              </div>
            `,
              )
              .join("");
          }
        } catch (err) {
          console.error(err);
        }
      });
    </script>
  </body>
</html>
