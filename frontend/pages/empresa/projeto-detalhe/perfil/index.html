<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Perfil do Ponto de Coleta | CONTINUUM</title>
    <link rel="stylesheet" href="../../../css/global.css" />
    <link rel="stylesheet" href="../../../css/responsive.css" />
    <link rel="stylesheet" href="../../../components/header/header.css" />
    <style>
      .profile {
        max-width: 900px;
        margin: 2rem auto;
        padding: 1rem;
      }
      .profile form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
      }
      .profile label {
        display: grid;
        gap: 0.4rem;
      }
      .profile input,
      .profile textarea,
      .profile select {
        padding: 0.7rem;
      }
      .wide {
        grid-column: 1/-1;
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <div id="appHeader" data-role="empresa" data-active="perfil"></div>
      <main class="main-content profile">
        <h1>Perfil do Ponto de Coleta</h1>
        <p id="accessMessage" role="status"></p>
        <form id="profileForm">
          <label>Razão Social<input id="razao" required /></label
          ><label>Nome Fantasia<input id="fantasia" required /></label
          ><label>CNPJ<input id="cnpj" readonly /></label
          ><label>E-mail do responsável<input id="email" type="email" /></label
          ><label>Telefone<input id="telefone" /></label
          ><label>CEP<input id="cep" /></label
          ><label>Rua / Logradouro<input id="logradouro" /></label
          ><label>Número<input id="numero" /></label
          ><label>Complemento<input id="complemento" /></label
          ><label>Bairro<input id="bairro" /></label
          ><label>Cidade<input id="cidade" /></label
          ><label>UF<input id="uf" readonly /></label
          ><label
            >Segmento<select id="segmento">
              <option>Moda Feminina</option>
              <option>Moda Masculina</option>
              <option>Streetwear / Jeans</option>
              <option>Moda Infantil</option>
              <option>Multimarcas / Departamento</option>
              <option>Outros</option>
            </select></label
          ><label
            >Porte<select id="porte">
              <option>MEI / Microempresa</option>
              <option>Pequeno Porte</option>
              <option>Médio Porte</option>
              <option>Grande Porte</option>
            </select></label
          ><label class="wide"
            >Perfil da loja / público-alvo<textarea
              id="perfilLoja"
            ></textarea></label
          ><label>Logo da loja (URL)<input id="logo" type="url" /></label
          ><label
            >Percentual padrão de cupom (%)<input
              id="percentual"
              type="number"
              min="0"
              max="100" /></label
          ><label
            >Validade do cupom (dias)<input
              id="validade"
              type="number"
              min="1" /></label
          ><label class="wide"
            >Cartilha padrão de qualidade<textarea
              id="cartilha"
            ></textarea></label
          ><label>Horário de retirada<input id="horario" /></label
          ><label
            ><input id="aceitaRetirada" type="checkbox" /> Aceita retirada
            presencial no Ponto de Coleta</label
          ><button class="btn btn--primary wide" type="submit">
            Salvar perfil, cartilha e política
          </button>
        </form>
        <p id="saveMessage" role="status"></p>
      </main>
    </div>
    <script type="module" src="script.js"></script>
    <script src="../../../components/header/header.js"></script>
  </body>
</html>
