<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eff0e8" />
  <title>Entrar | CONTINUUM</title>
  <link rel="stylesheet" href="../../../css/global.css" />
  <link rel="stylesheet" href="../../../css/responsive.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="login-page">
  <main class="login-page__main">
    <section class="login-card" aria-labelledby="login-card-title">
      <header class="login-card__header">
        <div class="login-card__brand" aria-label="CONTINUUM">
          <span class="login-card__brand-name">CONTINUUM</span>
          <span class="login-card__brand-tagline">ECONOMIA CIRCULAR · UPCYCLING · MODA</span>
        </div>
      </header>

      <div class="login-switch" role="group" aria-label="Selecione o perfil para entrar">
        <button class="login-switch__option" type="button" value="doador" aria-pressed="true">Doador</button>
        <button class="login-switch__option" type="button" value="designer" aria-pressed="false">Designer</button>
        <button class="login-switch__option" type="button" value="empresa" aria-pressed="false">Empresa</button>
      </div>

      <form id="formLogin" class="login-form">
        <div class="login-form__field">
          <label class="login-form__label" for="loginIdentificador" id="loginIdentificadorLabel">Nome de usuário</label>
          <input class="form-input login-form__input" type="text" id="loginIdentificador" name="usuario" placeholder="Digite seu nome de usuário" autocomplete="username" required />
        </div>

        <div class="login-form__field">
          <label class="login-form__label" for="loginSenha">Senha</label>
          <div class="login-form__password-wrap">
            <input class="form-input login-form__input" type="password" id="loginSenha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required />
            <button class="login-form__password-toggle" type="button" aria-controls="loginSenha" aria-pressed="false" aria-label="Mostrar ou ocultar senha">
              <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="btn btn--primary btn--full login-form__submit" type="submit">Entrar</button>
        <div class="login-card__forgot-row">
          <button class="login-card__forgot" type="button" id="forgotPassword">Esqueci minha senha</button>
        </div>
        <p class="login-form__status" id="loginStatus" role="status" aria-live="polite"></p>
      </form>

      <footer class="login-card__footer">
        <div class="login-card__help-wrap">
          <button class="login-card__help" type="button" id="loginHelp" aria-label="Ajuda sobre os dados de acesso" aria-expanded="false" aria-controls="loginHelpMessage">?</button>
          <div class="login-card__help-message" id="loginHelpMessage" role="status" hidden>
            <div class="login-card__help-header">
              <strong>Ajuda de Acesso</strong>
              <button class="login-card__help-close" type="button" id="loginHelpClose" aria-label="Fechar ajuda">×</button>
            </div>
            <p>Contas demo: <strong>doador</strong> (doador123), <strong>designer</strong> (designer123), <strong>empresa</strong> (empresa123).</p>
          </div>
        </div>
      </footer>

      <p class="login-card__signup">Não tem usuário? <a href="../cadastro/index.html">Cadastre-se</a></p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
