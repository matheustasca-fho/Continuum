<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eff0e8" />
    <title>Cadastro | CONTINUUM</title>
    <link rel="stylesheet" href="../../../../css/global.css" />
    <link rel="stylesheet" href="../../../../css/responsive.css" />
    <link rel="stylesheet" href="cadastro-pessoa.css" />
  </head>
  <body class="person-signup">
    <main class="person-signup__main">
      <a class="person-signup__back" href="../index.html"
        ><span aria-hidden="true">←</span> Voltar à escolha de perfil</a
      >

      <section class="person-card" aria-labelledby="person-card-title">
        <header class="person-card__header">
          <a
            class="person-card__brand"
            href="../../../../index.html"
            aria-label="CONTINUUM — página inicial"
          >
            <span class="person-card__brand-name">CONTINUUM</span>
            <span class="person-card__brand-tagline"
              >ECONOMIA CIRCULAR · UPCYCLING · MODA</span
            >
          </a>
          <h1 class="person-card__title" id="person-card-title">
            Cadastro Designer
          </h1>
          <p class="person-card__description">
            Crie sua conta para confeccionar e dar vida aos materiais.
          </p>
        </header>

        <div class="person-switch" role="group" aria-label="Tipo de pessoa">
          <button
            class="person-switch__option"
            type="button"
            value="fisica"
            aria-pressed="true"
          >
            Pessoa Física
          </button>
          <button
            class="person-switch__option"
            type="button"
            value="juridica"
            aria-pressed="false"
          >
            Pessoa Jurídica
          </button>
        </div>

        <form class="person-form" id="formCadastroPessoa" novalidate>
          <div class="person-form__grid">
            <div class="person-form__field">
              <label class="person-form__label" for="documentoPessoa"
                ><span id="documentoTipo">CPF</span>
                <span class="person-form__required">*</span></label
              >
              <input
                class="form-input person-form__input"
                type="text"
                id="documentoPessoa"
                name="CPF"
                placeholder="CPF"
                inputmode="numeric"
                autocomplete="off"
                maxlength="14"
                aria-describedby="docAjuda"
                required
              />
              <p
                id="docAjuda"
                class="person-form__hint"
                style="display: none"
              ></p>
            </div>

            <div class="person-form__field">
              <label class="person-form__label" for="senhaPessoa"
                >Senha <span class="person-form__required">*</span></label
              >
              <div class="person-form__password-wrap">
                <input
                  class="form-input person-form__input"
                  type="password"
                  id="senhaPessoa"
                  name="SENHA_CONFECCIONISTA"
                  placeholder="Senha"
                  autocomplete="new-password"
                  aria-describedby="senhaPessoaAjuda"
                  required
                />
                <button
                  class="person-form__password-toggle"
                  type="button"
                  aria-controls="senhaPessoa"
                  aria-pressed="false"
                  aria-label="Mostrar ou ocultar senha"
                >
                  <svg
                    class="icon-eye-open"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg
                    class="icon-eye-closed"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    style="display: none"
                  >
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                    />
                    <line x1="1" y1="1" x2="23" y2="23" />
                  </svg>
                </button>
              </div>
              <p
                id="senhaPessoaAjuda"
                class="person-form__hint"
                style="display: none"
              ></p>
            </div>

            <div class="person-form__field person-form__field--wide">
              <label class="person-form__label" for="nomeConfeccionista"
                >Nome completo
                <span class="person-form__required">*</span></label
              >
              <input
                class="form-input person-form__input"
                type="text"
                id="nomeConfeccionista"
                name="NM_CONFECCIONISTA"
                placeholder="Nome completo"
                autocomplete="name"
                maxlength="150"
                required
              />
            </div>

            <div class="person-form__field">
              <label class="person-form__label" for="cepPessoa"
                >CEP <span class="person-form__required">*</span></label
              >
              <input
                class="form-input person-form__input"
                type="text"
                id="cepPessoa"
                name="CEP"
                placeholder="CEP"
                inputmode="numeric"
                autocomplete="postal-code"
                maxlength="9"
                aria-describedby="cepPessoaAjuda"
                required
              />
              <p
                id="cepPessoaAjuda"
                class="person-form__hint"
                style="display: none"
              ></p>
            </div>

            <div class="person-form__field">
              <label class="person-form__label" for="numeroEndereco"
                >Número do endereço
                <span class="person-form__required">*</span></label
              >
              <input
                class="form-input person-form__input"
                type="text"
                id="numeroEndereco"
                name="NR_ENDERECO"
                placeholder="Número"
                inputmode="numeric"
                maxlength="6"
                required
              />
            </div>
          </div>

          <button
            class="btn btn--primary btn--full person-form__submit"
            type="submit"
          >
            Cadastrar-se <span aria-hidden="true">↗</span>
          </button>
          <div class="person-card__footer-centered">
            <p>
              Já tem uma conta?
              <a href="../../login/index.html" class="person-card__login-link"
                >Entrar</a
              >
            </p>
          </div>
          <p
            class="person-form__status"
            id="personFormStatus"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>
    </main>
    <script src="cadastro-pessoa.js"></script>
  </body>
</html>
