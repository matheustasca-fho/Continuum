<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eff0e8" />
  <title>Cadastro | CONTINUUM</title>
  <link rel="stylesheet" href="../../../../css/global.css" />
  <link rel="stylesheet" href="../../../../css/responsive.css" />
  <link rel="stylesheet" href="cadastro-pessoa.css" />
</head>
<body class="person-signup">
  <main class="person-signup__main">
    <a class="person-signup__back" href="../index.html"><span aria-hidden="true">←</span> Voltar à escolha de perfil</a>

    <section class="person-card" aria-labelledby="person-card-title">
      <header class="person-card__header">
        <div class="person-card__brand" aria-label="CONTINUUM">
          <span class="person-card__brand-name">CONTINUUM</span>
          <span class="person-card__brand-tagline">ECONOMIA CIRCULAR · UPCYCLING · MODA</span>
        </div>
        <span class="person-card__seam" aria-hidden="true"></span>
        <h1 class="person-card__title" id="person-card-title">Crie sua conta</h1>
      </header>

      <div class="person-switch" role="group" aria-label="Tipo de pessoa">
        <button class="person-switch__option" type="button" value="fisica" aria-pressed="true">Pessoa Física</button>
        <button class="person-switch__option" type="button" value="juridica" aria-pressed="false">Pessoa Jurídica</button>
      </div>

      <form class="person-form" id="formCadastroPessoa">
        <div class="person-form__grid">
          <div class="person-form__field">
            <label class="person-form__label" for="documentoPessoa"><span id="documentoTipo">CPF</span> <span class="person-form__required">Obrigatório</span></label>
            <input class="form-input person-form__input" type="text" id="documentoPessoa" name="CPF" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off" required />
          </div>

          <div class="person-form__field">
            <label class="person-form__label" for="senhaPessoa">Senha <span class="person-form__required">Obrigatória · máx. 10 caracteres</span></label>
            <input class="form-input person-form__input" type="password" id="senhaPessoa" name="SENHA_CONFECCIONISTA" placeholder="Até 10 caracteres" autocomplete="new-password" maxlength="10" required />
          </div>

          <div class="person-form__field person-form__field--wide">
            <label class="person-form__label" for="nomeConfeccionista">Nome completo <span class="person-form__required">Obrigatório</span></label>
            <input class="form-input person-form__input" type="text" id="nomeConfeccionista" name="NM_CONFECCIONISTA" placeholder="Digite seu nome completo" autocomplete="name" maxlength="150" required />
          </div>

          <div class="person-form__field">
            <label class="person-form__label" for="cepPessoa">CEP <span class="person-form__required">Obrigatório</span></label>
            <input class="form-input person-form__input" type="text" id="cepPessoa" name="CEP" placeholder="00000-000" inputmode="numeric" autocomplete="postal-code" maxlength="9" required />
          </div>

          <div class="person-form__field">
            <label class="person-form__label" for="numeroEndereco">Número do endereço <span class="person-form__required">Obrigatório</span></label>
            <input class="form-input person-form__input" type="text" id="numeroEndereco" name="NR_ENDERECO" placeholder="Nº" inputmode="numeric" maxlength="4" required />
          </div>
        </div>

        <button class="btn btn--primary btn--full person-form__submit" type="submit">Cadastrar-se</button>
        <p class="person-form__status" id="personFormStatus" role="status" aria-live="polite"></p>
      </form>

      <footer class="person-card__footer">
        <p>Já tem uma conta? <a href="../../login/index.html" class="person-card__login-link">Entrar</a></p>
        <span class="person-card__footer-note">FEITO PARA CIRCULAR</span>
      </footer>
    </section>
  </main>
  <script src="cadastro-pessoa.js"></script>
</body>
</html>
